<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导师首页 · AI 入口优化稿</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 20px 12px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      color: #1a1a1a;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(180deg, #dce9ff 0%, #f5f8fc 38%, #f5f8fc 100%);
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(30, 60, 120, 0.12);
      overflow: hidden;
      padding-bottom: 28px;
    }
    .caption {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #667;
      margin-bottom: 10px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 8px;
    }
    .back {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      color: #222; font-size: 22px; line-height: 1;
    }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 99px;
      background: #fff; font-size: 12px; font-weight: 600; color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .pill .dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: #2f6bff; color: #fff; font-size: 10px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .pill .grid {
      width: 14px; height: 14px;
      background:
        radial-gradient(circle at 25% 25%, #2f6bff 1.6px, transparent 1.7px),
        radial-gradient(circle at 75% 25%, #2f6bff 1.6px, transparent 1.7px),
        radial-gradient(circle at 25% 75%, #2f6bff 1.6px, transparent 1.7px),
        radial-gradient(circle at 75% 75%, #2f6bff 1.6px, transparent 1.7px);
    }

    /* ===== AI 入口：讲座条结构 + 导师页浅色风格 ===== */
    .ai-wrap { padding: 6px 16px 0; }
    .ai-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 6px 6px 6px 14px;
      border-radius: 99px;
      background: #fff;
      border: 1px solid #c8d8f8;
      box-shadow: 0 2px 10px rgba(47, 107, 255, 0.06);
    }
    .ai-star {
      width: 16px; height: 16px; flex-shrink: 0;
      background: linear-gradient(135deg, #6b9bff, #2f6bff);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    .ai-text {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      font-weight: 500;
      color: #9aa3b5;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }
    .ai-send {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: #2f6bff;
      display: flex; align-items: center; justify-content: center;
    }
    .ai-send svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

    .chips {
      display: flex; gap: 7px; overflow-x: auto;
      padding: 10px 16px 4px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 6px 12px; border-radius: 99px;
      background: #fff;
      border: 1px solid #e4ebf7;
      box-shadow: 0 1px 4px rgba(47,107,255,0.04);
      font-size: 12.5px; font-weight: 600; color: #4a5a78;
      white-space: nowrap;
    }

    .section { padding: 16px 16px 0; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px 5px 12px; border-radius: 99px;
      background: #2f6bff; color: #fff; font-size: 13px; font-weight: 700;
    }
    .badge .n {
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; color: #2f6bff; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
    }
    .link { font-size: 12.5px; color: #2f6bff; font-weight: 600; }
    .link .ico { margin-left: 2px; }

    .my-list { display: flex; flex-direction: column; gap: 8px; }
    .my-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 14px; background: #fff;
      box-shadow: 0 2px 10px rgba(30,60,120,0.05);
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(145deg, #c8d8ff, #9eb6ff);
    }
    .avatar.b { background: linear-gradient(145deg, #ffd9b0, #f0a070); }
    .my-row .meta { flex: 1; min-width: 0; }
    .my-row .name { font-size: 14px; font-weight: 700; }
    .my-row .sub { font-size: 12px; color: #889; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chev { color: #c0c8d4; font-size: 18px; }

    .ai-head-tools { display: flex; align-items: center; gap: 12px; }
    .refresh { font-size: 12.5px; color: #5a6a88; font-weight: 600; }

    .rec-card {
      background: #fff; border-radius: 16px; padding: 14px;
      box-shadow: 0 2px 12px rgba(30,60,120,0.06);
      margin-bottom: 10px;
    }
    .rec-top { display: flex; gap: 10px; align-items: flex-start; }
    .match {
      margin-left: auto; flex-shrink: 0;
      padding: 3px 8px; border-radius: 99px;
      background: #ffe8d6; color: #d06a2a; font-size: 11px; font-weight: 700;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
    .tag {
      padding: 3px 9px; border-radius: 99px;
      background: #eaf1ff; color: #3a6fd8; font-size: 11.5px; font-weight: 600;
    }
    .quote {
      font-size: 12.5px; color: #778; line-height: 1.45;
      padding-left: 2px;
    }
    .quote::before { content: '“'; color: #b8c4d8; font-weight: 700; margin-right: 2px; }
    .rec-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #f0f2f6;
    }
    .quota { font-size: 12px; color: #99a; font-weight: 600; }
    .btn {
      padding: 7px 14px; border-radius: 99px; border: none;
      background: #2f6bff; color: #fff; font-size: 12.5px; font-weight: 700;
    }

    .refs {
      max-width: 390px; width: 100%;
      margin: 18px auto 0;
      display: grid; gap: 10px;
    }
    .refs h2 { font-size: 12px; color: #889; font-weight: 600; text-align: center; }
    .refs img {
      width: 100%; height: auto; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); background: #fff;
    }
  </style>
</head>
<body>
  <div>
    <p class="caption">导师首页 · AI 入口（讲座结构 × 本页浅色风格）</p>
    <div class="phone">
      <div class="topbar">
        <div class="back">‹</div>
        <div class="top-actions">
          <span class="pill"><span class="dot">E</span>员工 ▾</span>
          <span class="pill"><span class="grid"></span>智能体</span>
        </div>
      </div>

      <div class="ai-wrap">
        <div class="ai-bar" role="button" aria-label="打开导师 AI 会话">
          <span class="ai-star" aria-hidden="true"></span>
          <span class="ai-text">和导师AI聊聊，找到适合你的导师</span>
          <span class="ai-send" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12l15-7-4.5 15-3.5-6zM12 13.5 20 5"/></svg>
          </span>
        </div>
      </div>

      <div class="chips">
        <span class="chip">带我做数据分析</span>
        <span class="chip">团队管理与招聘</span>
        <span class="chip">国际化产品方向</span>
      </div>

      <div class="section">
        <div class="section-head">
          <span class="badge">我的导师 <span class="n">2</span></span>
          <span class="link">查看全部<span class="ico">›</span></span>
        </div>
        <div class="my-list">
          <div class="my-row">
            <div class="avatar"></div>
            <div class="meta">
              <div class="name">高子阳</div>
              <div class="sub">测试总监 · 质量部</div>
            </div>
            <span class="chev">›</span>
          </div>
          <div class="my-row">
            <div class="avatar b"></div>
            <div class="meta">
              <div class="name">钟瀚林</div>
              <div class="sub">高级技术总监 · 线下系统开发部</div>
            </div>
            <span class="chev">›</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <strong style="font-size:15px">AI 为你推荐</strong>
          <div class="ai-head-tools">
            <span class="refresh">↻ 换一批</span>
            <span class="link">查看全部<span class="ico">›</span></span>
          </div>
        </div>

        <div class="rec-card">
          <div class="rec-top">
            <div class="avatar"></div>
            <div class="meta" style="flex:1;min-width:0">
              <div class="name">胡元</div>
              <div class="sub">产品总监 · 产品设计部</div>
            </div>
            <span class="match">匹配度 80%</span>
          </div>
          <div class="tags">
            <span class="tag">竞品分析</span>
            <span class="tag">交互设计</span>
            <span class="tag">电商产品</span>
          </div>
          <p class="quote">与你的技能标签「电商产品、后端产品」高度匹配</p>
          <div class="rec-foot">
            <span class="quota">2/3</span>
            <button class="btn" type="button">查看并申请</button>
          </div>
        </div>

        <div class="rec-card">
          <div class="rec-top">
            <div class="avatar b"></div>
            <div class="meta" style="flex:1;min-width:0">
              <div class="name">李增光</div>
              <div class="sub">测试 · 质量部</div>
            </div>
            <span class="match">匹配度 38%</span>
          </div>
          <div class="tags">
            <span class="tag">自动化测试</span>
            <span class="tag">功能测试</span>
          </div>
          <p class="quote">该导师有一定沉淀，或有可借鉴之处</p>
          <div class="rec-foot">
            <span class="quota">0/3</span>
            <button class="btn" type="button">查看并申请</button>
          </div>
        </div>
      </div>
    </div>

    <div class="refs">
      <h2>参考：改前搜索条 / 讲座 AI 条</h2>
      <img src="preview/mentor-ai-bar-before.png" alt="改前：白色搜索条 + 问">
      <img src="preview/mentor-ai-bar-ref.png" alt="参考：讲座毛玻璃 AI 条">
    </div>
  </div>
</body>
</html>
